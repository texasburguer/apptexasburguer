<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Carregando…</title>
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{margin:0;height:100%;background:#14100c;color:#d9cdb8;font:16px/1.4 system-ui,sans-serif}#c{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:0 24px;gap:14px}#c button{font:inherit;padding:12px 22px;border-radius:12px;border:0;background:#d9a21b;color:#14100c;font-weight:700}</style>
<script src="config-restaurante.js"></script>
</head>
<body>
<div id="c"><div id="m">Carregando…</div></div>
<script>
/* PÁGINA-CARREGADORA: o sistema inteiro mora no repositório "motor" (versão escolhida em config-restaurante.js → motor).
   Este arquivo só busca a página do sistema, aponta os endereços relativos para o motor e abre. */
(function(){
  var R, M;
  function erro(t){
    var c = document.getElementById('c'); if(!c) return;
    c.innerHTML = '<div style="font-size:42px">⚠️</div><div><b>Não foi possível abrir o sistema.</b></div><div>' + t + '</div><button onclick="location.reload()">Tentar de novo</button>';
  }
  function iniciar(){
    R = window.RESTAURANTE || {}; M = R.motor || '';
    try{ var fb = R.marca && R.marca.cores && R.marca.cores.fundo; if(fb && /^#[0-9a-fA-F]{6}$/.test(fb)) document.documentElement.style.background = document.body.style.background = fb; }catch(e){}
    if(!M || !/^https?:\/\/.+\/$/.test(M)){ erro('Falta o endereço do motor em config-restaurante.js (campo "motor").'); return; }
    var aqui = location.href.split('?')[0].split('#')[0].replace(/[^/]*$/, '');
    var origem = new URL(M).origin;
    /* Marca e módulos definidos no Painel de Revenda: valem na hora, sem mexer no GitHub do restaurante.
       Usa a última cópia guardada no aparelho e atualiza em segundo plano; se o painel estiver fora do ar, vale o config-restaurante.js. */
    var CK = 'rvConfigRemota_v1_' + (R.slug || '');
    function mesclar(c){ try{ if(c && c.ok){ if(c.marca && typeof c.marca === 'object' && Object.keys(c.marca).length) R.marca = Object.assign({}, R.marca || {}, c.marca, { cores: Object.assign({}, (R.marca || {}).cores || {}, c.marca.cores || {}), logos: Object.assign({}, (R.marca || {}).logos || {}, c.marca.logos || {}) }); if(c.modulos && typeof c.modulos === 'object' && Object.keys(c.modulos).length) R.modulos = Object.assign({}, R.modulos || {}, c.modulos); } }catch(e){} }
    try{ mesclar(JSON.parse(localStorage.getItem(CK) || 'null')); }catch(e){}
    var remota = fetch('https://ufoivqszbpznwwkpbvil.supabase.co/rest/v1/rpc/config_restaurante', { method:'POST', headers:{ apikey:'sb_publishable_u9l2Jz3-aMrnU1JKrQwEUw_46OKJ2m9', 'Content-Type':'application/json' }, body: JSON.stringify({ p_slug: R.slug || '', p_url: R.supabaseUrl || '' }) })
      .then(function(r){ return r.ok ? r.json() : null; }).then(function(c){ if(c && c.ok){ try{ localStorage.setItem(CK, JSON.stringify(c)); }catch(e){} return c; } return null; }).catch(function(){ return null; });
    var primeira = null; try{ primeira = localStorage.getItem(CK); }catch(e){}
    var espera = primeira ? Promise.resolve(null) : Promise.race([remota, new Promise(function(ok){ setTimeout(function(){ ok(null); }, 1500); })]);
    espera.then(function(c){ if(c) mesclar(c); return fetch(M + 'index.html', { cache: 'no-cache' }); }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    }).then(function(html){
      var fundo = '#14100c'; try{ var fb2 = R.marca && R.marca.cores && R.marca.cores.fundo; if(fb2 && /^#[0-9a-fA-F]{6}$/.test(fb2)) fundo = fb2; }catch(e){}
      var cab = '<base href="' + M + '"><style>html,body{background:' + fundo + '}</style><script>window.SW_URL_=' + JSON.stringify(aqui + 'sw.js') + ';window.MOTOR_URL_=' + JSON.stringify(M) + ';window.RESTAURANTE=' + JSON.stringify(R).replace(/</g, '\\u003c') + ';<\/script>';
      html = html.replace(/<head>/i, '<head>' + cab)
        .replace('<script src="config-restaurante.js"><\/script>', '')
        .replace('<link rel="manifest" href="manifest.webmanifest">', '<link rel="manifest" href="' + aqui + 'manifest.webmanifest">')
        .replace(/<script src="/g, '<script crossorigin="anonymous" src="')
        .replace(/<link rel="stylesheet" href="(css\/)/g, '<link rel="stylesheet" crossorigin="anonymous" href="$1')
        .replace(/(<meta http-equiv="Content-Security-Policy" content=")([^"]*)"/i, function(_, a, csp){
          return a + csp.replace(/'self'/g, "'self' " + origem).replace("base-uri 'none'", 'base-uri ' + origem) + '"';
        });
      /* Logo do restaurante desde o primeiro instante: a página do motor traz uma logo padrão (img/logo.png) na abertura e no topo; troca pela logo deste restaurante antes de desenhar. */
      try{ var lg = R.marca && R.marca.logos && R.marca.logos.cardapio; if(lg) lg = new URL(lg, aqui).href; if(lg && /^https?:\/\/[^\s"'()<>]+$/.test(lg)) html = html.split('url(img/logo.png)').join('url(' + lg + ')').split('src="img/logo.png"').join('src="' + lg + '"'); }catch(e){}
      document.open(); document.write(html); document.close();
    }).catch(function(e){ erro('Confira a internet. (' + (e && e.message || e) + ')'); });
  }
  /* Configuração velha guardada no aparelho (sem o campo "motor"): busca de novo, sem cache, e continua. */
  if(window.RESTAURANTE && window.RESTAURANTE.motor){ iniciar(); }
  else {
    fetch('config-restaurante.js', { cache: 'reload' }).then(function(r){ return r.text(); })
      .then(function(t){ (0, eval)(t); }).catch(function(){}).then(iniciar);
  }
})();
</script>
</body>
</html>
